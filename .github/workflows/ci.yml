name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      # The bundle greps run against the freshly built dist, so the gate is asserted on
      # what would actually ship rather than on a stale artefact.
      - name: Test
        run: npm test
      - name: Bundle budget
        run: node scripts/bundle-budget.mjs
