<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Linkage — removing names does not anonymize anything</title>
    <meta
      name="description"
      content="An explainer on re-identification. All records are generated. No real person's data is used or accepted."
    />
    <meta name="color-scheme" content="light dark" />
    <!--
      The mark, from the brand export. An SVG for anything that takes one, a 180 px PNG
      for the iOS home screen, and the manifest for Android and desktop installs. The
      previous inline data URI drew a different mark by hand; these are the real one.
    -->
    <link rel="icon" href="brand/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="brand/icon-180.png" />
    <link rel="manifest" href="site.webmanifest" />
    <!--
      The ground is applied before first paint, so a reader who has chosen the plate does
      not get a frame of the ledger first. Kept in the document rather than in the bundle
      because by the time a module runs, the page has already painted. It reads one
      preference and writes one attribute; it makes no request and touches nothing else.
    -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('linkage.ground.v1');
          var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var ground = stored === 'ledger' || stored === 'plate' ? stored : dark ? 'plate' : 'ledger';
          document.documentElement.setAttribute('data-theme', ground);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'ledger');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
